<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芙宁娜的画廊 · Furina Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header-top">
        <div class="header-container">
            <div class="logo">🦕</div>
            <div class="audio-control">
                <audio id="audio" controls preload="none">
                    Your browser does not support the audio element.
                </audio>
                <div class="audio-actions">
                    <button id="music-toggle" type="button">Play Music</button>
                    <button id="prev-track" type="button">Prev</button>
                    <button id="next-track" type="button">Next</button>
                    <button id="random-track" type="button">Random Track</button>
                    <label class="upload-label">
                        Upload song
                        <input id="upload-track" type="file" accept="audio/*" multiple title="Upload audio files" />
                    </label>
                </div>
                <p id="track-name" role="status"></p>
            </div>
        </div>
    </header>
    
    <main id="paintings">
        <section id="paintings-gallery" class="gallery-section">
            <h2 style="text-align: center;">芙宁娜的画廊</h2>
            <p>记录芙宁娜与奇妙世界相遇的每一幕。</p>
            <p id="count" aria-live="polite"></p><p id="status" role="status">画作加载中…</p><button id="retry" hidden>重新加载</button><div id="gallery" class="gallery-grid"></div><div class="more-wrap"><button id="more" hidden>加载更多</button><p id="progress"></p></div>
        </section>
    </main>
    
    <dialog id="lightbox" aria-label="查看画作"><button id="close" class="close" aria-label="关闭大图">×</button><button id="previous" class="arrow previous" aria-label="上一张">‹</button><div class="art-view"><img id="full-image" alt=""><p id="image-status" role="status"></p><button id="image-retry" hidden>重新加载图片</button><p id="image-position"></p><a id="download" target="_blank" rel="noopener">打开高清图 ↗</a></div><button id="next" class="arrow next" aria-label="下一张">›</button></dialog>
    <footer>
        <p>Furina Gallery · 献给芙宁娜</p>
        <div class="social-links" hidden>
            <a href="#">Bluesky</a>
            <a href="#">Facebook</a>
            <a href="#">Instagram</a>
            <a href="#">Amazon</a>
            <a href="#">Patreon</a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
